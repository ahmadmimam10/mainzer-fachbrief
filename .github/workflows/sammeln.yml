name: Quellen abrufen

# Dokumentiert nur – schlägt nie „rot“ fehl und verschickt daher keine Mails.
# Fehler landen in daten/laufprotokoll.json und daten/quellen-zustand.json; die Qualitätssicherungs-Routine
# (alle 3 Tage, siehe QUALITAET.md) wertet sie aus und repariert.
on:
  schedule:
    # mehrmals täglich (Zeiten in UTC): 03:47, 06:47, 09:47, 12:47, 15:47, 18:47, 21:47 Uhr Winterzeit
    - cron: "47 2,5,8,11,14,17,20 * * *"
  workflow_dispatch:

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      geaendert: ${{ steps.speichern.outputs.geaendert }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Quellen abrufen und protokollieren
        run: |
          set +e
          node werkzeuge/sammeln.mjs 2>&1 | tee abruf.log
          code=${PIPESTATUS[0]}
          node werkzeuge/protokoll.mjs "$code" abruf.log
          node werkzeuge/sammeln.mjs --zustand
          node werkzeuge/wetter.mjs          # Wetterlage für Mainz (wählt die Intro-Variante), scheitert nie
          node werkzeuge/intro-funde.mjs --album || true   # Fundstück-Album: was heute im Startbild zu sehen ist
          rm -f abruf.log
          exit 0
      - name: Ergebnis speichern
        id: speichern
        run: |
          git config user.name "Boniblatt-Abruf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten docs/daten
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
            echo "geaendert=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Abruf $(date -u +'%Y-%m-%d %H:%M') UTC"
          for versuch in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "geaendert=ja" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main hat sich geändert – Abruf auf neuem Stand wiederholen ($versuch)"
            git fetch -q origin main
            git reset -q --hard origin/main
            node werkzeuge/sammeln.mjs > abruf.log 2>&1; node werkzeuge/protokoll.mjs "$?" abruf.log; rm -f abruf.log
            node werkzeuge/wetter.mjs
            node werkzeuge/intro-funde.mjs --album || true
            git add daten docs/daten
            git diff --cached --quiet && { echo "geaendert=nein" >> "$GITHUB_OUTPUT"; exit 0; }
            git commit -q -m "Abruf $(date -u +'%Y-%m-%d %H:%M') UTC"
          done
          echo "::warning::Speichern nicht möglich – der nächste Lauf versucht es erneut."
          echo "geaendert=nein" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seite neu veröffentlichen
        if: steps.speichern.outputs.geaendert == 'ja'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run seite.yml --ref main --repo "$GITHUB_REPOSITORY"
