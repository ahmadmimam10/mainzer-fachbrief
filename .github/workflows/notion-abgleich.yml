name: Notion-Abgleich
# Übergangszeit: Kommt alles, was Make.com in die Notion-Datenbank „AZ“ schreibt, auch beim eigenen Abruf an?
# Jeden Morgen kurz nach 5 Uhr (Winterzeit) werden die letzten 24 Stunden bis 5 Uhr abgeglichen, das Fenster vom Vortag
# wird dabei noch einmal nachgeprüft (werkzeuge/notion-abgleich.mjs). Das Ergebnis liegt in daten/notion-abgleich.json und
# steht in docs/verwaltung.html unter „Notion-Abgleich“.
# Braucht das Repository-Secret NOTION_TOKEN (Notion-Verbindung mit Lesezugriff auf die Datenbank „AZ“).
# Am 7. Dezember 2026 prüft er nur noch das letzte Fenster nach und schaltet sich dann selbst ab.
on:
  schedule:
    # 04:05 UTC = 5:05 Uhr Winterzeit (nicht genau zur vollen Stunde, da sind GitHubs Zeitpläne oft überlastet)
    - cron: "5 4 * * *"
  workflow_dispatch:
    inputs:
      bis:
        description: "Die 24 Stunden bis zu diesem Tag 5 Uhr (neu) prüfen (JJJJ-MM-TT); leer = wie geplant"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: notion-abgleich
  cancel-in-progress: false

jobs:
  abgleichen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notion mit dem Abruf vergleichen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node werkzeuge/notion-abgleich.mjs ${{ github.event.inputs.bis && format('--bis={0}', github.event.inputs.bis) || '' }} || true
      - name: Ergebnis speichern
        run: |
          git config user.name "Boniblatt-Abgleich"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e                      # dieser Lauf schlägt nie „rot“ fehl und verschickt keine Mails
          git add daten/notion-abgleich.json 2>/dev/null
          if git diff --cached --quiet; then echo "Nichts zu speichern."; exit 0; fi
          git commit -q -m "Notion-Abgleich $(date -u +'%Y-%m-%d')"
          git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; } || echo "::warning::Speichern nicht möglich – der nächste Lauf holt es nach."
          exit 0
      - name: Nach zwei Wochen abschalten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node werkzeuge/notion-abgleich.mjs --ist-beendet; then
            gh workflow disable notion-abgleich.yml --repo "$GITHUB_REPOSITORY" && echo "Abgleich beendet – Ablauf abgeschaltet." || echo "Abschalten nicht möglich."
          fi
          exit 0
