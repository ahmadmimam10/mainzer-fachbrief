name: Seite veröffentlichen

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Hörfassungen je Ressort als MP3: ElevenLabs (vier Stimmen im Wechsel), Ersatz Azure Speech (Gratis-Tarif F0).
      # Die MP3s landen nur im Seitenpaket, nicht im Repository; der Zwischenspeicher verhindert, dass derselbe Text
      # zweimal vertont (und bezahlt) wird.
      - name: Vertonungen aus dem Zwischenspeicher holen
        uses: actions/cache/restore@v4
        with:
          path: .audio-cache
          key: vertonung-${{ github.run_id }}
          restore-keys: vertonung-
      - name: Hörfassungen vertonen
        id: vertonen
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AB: ${{ vars.ELEVENLABS_AB }}
          ELEVENLABS_STIMMEN: ${{ vars.ELEVENLABS_STIMMEN }}
          ELEVENLABS_MAX: ${{ vars.ELEVENLABS_MAX }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_STIMME: ${{ vars.AZURE_SPEECH_STIMME }}
          AZURE_SPEECH_STIL: ${{ vars.AZURE_SPEECH_STIL }}
          AZURE_SPEECH_TEMPO: ${{ vars.AZURE_SPEECH_TEMPO }}
          AZURE_SPEECH_HOEHE: ${{ vars.AZURE_SPEECH_HOEHE }}
        run: node werkzeuge/vertonen.mjs
      - name: Vertonungen zwischenspeichern
        if: steps.vertonen.outputs.neu == 'ja'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .audio-cache
          key: vertonung-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # GitHub findet das eben hochgeladene Artefakt manchmal nicht sofort: dann kurz warten und einmal wiederholen.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Kurz warten vor dem zweiten Versuch
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
