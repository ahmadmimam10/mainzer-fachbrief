name: DeepSeek-Schattenlauf
# Vergleich im Hintergrund: DeepSeek wählt aus denselben Kandidaten wie die Morgenredaktion (Claude). Nichts davon erscheint
# auf der Webseite; das Ergebnis liegt in daten/schatten.json und wird in docs/verwaltung.html gezeigt. Hört nach zehn Ausgaben
# von selbst auf (LAEUFE in werkzeuge/schatten.mjs). Braucht das Repository-Secret DEEPSEEK_API_KEY.
on:
  # sobald die Morgenausgabe (Claude, werktags gegen 05:30 Uhr Winterzeit) im Repository liegt – also unmittelbar danach,
  # mit denselben Kandidaten
  push:
    branches: [main]
    paths: ["daten/ausgaben/**"]
  schedule:
    # Auffangnetz, falls der Anstoß ausbleibt: 05:50 und 06:40 Uhr Winterzeit (beides DeepSeek-Nebenzeit). Liegt der
    # Vergleich des Tages schon vor, endet der Lauf sofort.
    - cron: "50 4 * * 1-5"
    - cron: "40 5 * * 1-5"
    # letzter Versuch am späten Vormittag (wieder Nebenzeit), falls die Morgenausgabe einmal sehr spät kam
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schatten
  cancel-in-progress: false

jobs:
  vergleichen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: DeepSeek auswählen lassen
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node werkzeuge/schatten.mjs || true
      - name: Ergebnis speichern
        run: |
          git config user.name "Boniblatt-Schattenlauf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/schatten.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nichts zu speichern."; exit 0; fi
          git commit -q -m "Schattenlauf $(date -u +'%Y-%m-%d')"
          git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; } || echo "::warning::Speichern nicht möglich."
