name: DeepSeek-Schattenlauf
# Vergleich im Hintergrund: DeepSeek wählt aus denselben Kandidaten wie die Morgenredaktion (Claude). Nichts davon erscheint
# auf der Webseite; das Ergebnis liegt in daten/schatten.json und wird in docs/verwaltung.html gezeigt. Hört nach zehn Ausgaben
# von selbst auf (LAEUFE in werkzeuge/schatten.mjs). Braucht das Repository-Secret DEEPSEEK_API_KEY.
on:
  schedule:
    # werktags 11:20 Uhr (Winterzeit) – nach der Morgenausgabe und außerhalb der teureren DeepSeek-Hauptzeit (06–10 Uhr UTC)
    - cron: "20 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schatten
  cancel-in-progress: false

jobs:
  vergleichen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: DeepSeek auswählen lassen
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node werkzeuge/schatten.mjs || true
      - name: Ergebnis speichern
        run: |
          git config user.name "Boniblatt-Schattenlauf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/schatten.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nichts zu speichern."; exit 0; fi
          git commit -q -m "Schattenlauf $(date -u +'%Y-%m-%d')"
          git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; } || echo "::warning::Speichern nicht möglich."
